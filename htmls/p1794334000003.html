<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chula テキーラ ボトルデザイン</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Pacifico&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --page: #0d0710; --muted: #b9a5b3; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #f7e7f0; font-family: 'Zen Maru Gothic', sans-serif; padding: 20px 12px 40px; }
h1 { font-size: 1rem; margin: 0 0 4px; font-weight: 700; }
.lead { margin: 0 0 20px; color: var(--muted); font-size: .85rem; }
.board { margin: 0 auto 28px; }
.board h2 { font-size: .85rem; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
.fit { overflow: hidden; border-radius: 6px; }
.stage { transform-origin: top left; }
</style>
</head>
<body>
<h1>Chula TEQUILA — ボトルデザイン</h1>
<p class="lead">シーシャ店の暗い棚に並べる想定の架空ブランド。[ ] の中身は仮置き。</p>

<section class="board" style="max-width:1200px">
<h2>ラインナップ(暗い店内)</h2>
<div class="fit" id="fitMain"><div class="stage" id="stageMain" style="width:1200px;height:880px"></div></div>
</section>
<section class="board" style="max-width:1200px">
<h2>ラベル展開</h2>
<div class="fit" id="fitLabel"><div class="stage" id="stageLabel" style="width:1200px;height:760px"></div></div>
</section>

<script>
function bottle(p) { return `<div style="position: relative; width: 340px; height: 680px; font-family: 'Zen Maru Gothic', sans-serif; color: ${p.inkColor}">
<svg viewBox="0 0 340 680" width="340" height="680" style="position: absolute; left: 0px; top: 0px" aria-hidden="true">
<ellipse cx="170" cy="662" rx="120" ry="10" fill="#000000" opacity="0.3"></ellipse>
<rect x="150" y="92" width="40" height="44" rx="4" fill="#C9A27A" stroke="#2A0F24" style="stroke-width: 3px"></rect>
<path d="M170 50 C165 32 132 32 132 56 C132 76 155 88 170 102 C185 88 208 76 208 56 C208 32 175 32 170 50 Z" fill="${p.capColor}" stroke="#2A0F24" style="stroke-width: 3px; stroke-linejoin: round"></path>
<ellipse cx="150" cy="50" rx="6" ry="9" fill="#FFFFFF" opacity="0.55"></ellipse>
<path d="M146 128 L194 128 L194 205 C194 236 286 244 286 300 L286 610 C286 636 268 648 240 648 L100 648 C72 648 54 636 54 610 L54 300 C54 244 146 236 146 205 Z" fill="#E8F6F3" opacity="0.2"></path>
<path d="M56 300 L284 300 L284 610 C284 634 266 646 240 646 L100 646 C74 646 56 634 56 610 Z" fill="#FFF6D8" opacity="0.22"></path>
<path d="M146 128 L194 128 L194 205 C194 236 286 244 286 300 L286 610 C286 636 268 648 240 648 L100 648 C72 648 54 636 54 610 L54 300 C54 244 146 236 146 205 Z" fill="none" stroke="#FFFFFF" opacity="0.75" style="stroke-width: 3px; stroke-linejoin: round"></path>
<rect x="146" y="150" width="48" height="22" fill="${p.accentColor}" stroke="#2A0F24" style="stroke-width: 2.5px"></rect>
<rect x="64" y="300" width="9" height="300" rx="4.5" fill="#FFFFFF" opacity="0.3"></rect>
</svg>
<div style="position: absolute; left: 70px; top: 312px; width: 200px; height: 310px; box-sizing: border-box; padding: 12px 12px 14px; border-radius: 22px; border: 3px solid ${p.inkColor}; background: ${p.labelColor}; box-shadow: 0 0 28px ${p.labelColor}; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<div style="font-family: 'Bungee', sans-serif; font-size: 9px; letter-spacing: 0.08em">HECHO EN MÉXICO</div>
<svg viewBox="0 0 120 112" width="112" height="104" aria-hidden="true">
<path d="M60 60 L16 6 L46 52 Z" fill="${p.accentColor}"></path>
<path d="M60 60 L104 6 L74 52 Z" fill="${p.accentColor}"></path>
<path d="M60 62 L2 38 L40 64 Z" fill="${p.accentColor}"></path>
<path d="M60 62 L118 38 L80 64 Z" fill="${p.accentColor}"></path>
<path d="M24 58 C24 30 40 16 60 16 C80 16 96 30 96 58 C96 74 89 82 82 86 L82 98 C82 104 77 108 72 108 L48 108 C43 108 38 104 38 98 L38 86 C31 82 24 74 24 58 Z" fill="#FFF8F2" stroke="#2A0F24" style="stroke-width: 2.5px; stroke-linejoin: round"></path>
<circle cx="60" cy="26" r="4" fill="${p.capColor}"></circle>
<circle cx="66" cy="32" r="4" fill="${p.capColor}"></circle>
<circle cx="60" cy="38" r="4" fill="${p.capColor}"></circle>
<circle cx="54" cy="32" r="4" fill="${p.capColor}"></circle>
<circle cx="60" cy="32" r="2.5" fill="#2A0F24"></circle>
<path d="M45 56 C43 50 34 50 34 57 C34 63 41 67 45 71 C49 67 56 63 56 57 C56 50 47 50 45 56 Z" fill="${p.labelColor}" stroke="#2A0F24" style="stroke-width: 2px; stroke-linejoin: round"></path>
<path d="M75 56 C73 50 64 50 64 57 C64 63 71 67 75 71 C79 67 86 63 86 57 C86 50 77 50 75 56 Z" fill="${p.labelColor}" stroke="#2A0F24" style="stroke-width: 2px; stroke-linejoin: round"></path>
<path d="M35 53 L30 48 M39 50 L36 44 M85 53 L90 48 M81 50 L84 44" fill="none" stroke="#2A0F24" style="stroke-width: 2px; stroke-linecap: round"></path>
<path d="M60 75 L56.5 81 L63.5 81 Z" fill="#2A0F24"></path>
<path d="M46 94 L74 94 M50 90 L50 98 M55 90 L55 98 M60 90 L60 98 M65 90 L65 98 M70 90 L70 98" fill="none" stroke="#2A0F24" style="stroke-width: 2px; stroke-linecap: round"></path>
<circle cx="33" cy="76" r="3" fill="${p.capColor}"></circle>
<circle cx="87" cy="76" r="3" fill="${p.capColor}"></circle>
</svg>
<div style="font-family: 'Pacifico', cursive; font-size: 38px; line-height: 1.15">Chula</div>
<div style="font-family: 'Bungee', sans-serif; font-size: 22px; line-height: 1">TEQUILA</div>
<div style="font-family: 'Bungee', sans-serif; font-size: 11px; padding: 3px 10px; border-radius: 999px; background: ${p.accentColor}; color: #1A0A16">${p.variant}</div>
<div style="margin-top: auto; font-size: 9px; line-height: 1.4">[容量] ml ・ [度数]% vol<br>NOM-[番号]</div>
</div>
</div>`; }
function labels(p) { return `<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 48px; background: #FFF1F7; display: flex; flex-direction: row; justify-content: center; gap: 64px; font-family: 'Zen Maru Gothic', sans-serif; color: #2A0F24">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">表ラベル</h2>
<div style="width: 420px; height: 600px; box-sizing: border-box; padding: 28px; border-radius: 36px; border: 4px solid #2A0F24; background: ${p.labelColor}; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="font-family: 'Bungee', sans-serif; font-size: 14px; letter-spacing: 0.08em">HECHO EN MÉXICO</div>
<svg viewBox="0 0 120 112" width="240" height="224" aria-hidden="true">
<path d="M60 60 L16 6 L46 52 Z" fill="${p.accentColor}"></path>
<path d="M60 60 L104 6 L74 52 Z" fill="${p.accentColor}"></path>
<path d="M60 62 L2 38 L40 64 Z" fill="${p.accentColor}"></path>
<path d="M60 62 L118 38 L80 64 Z" fill="${p.accentColor}"></path>
<path d="M24 58 C24 30 40 16 60 16 C80 16 96 30 96 58 C96 74 89 82 82 86 L82 98 C82 104 77 108 72 108 L48 108 C43 108 38 104 38 98 L38 86 C31 82 24 74 24 58 Z" fill="#FFF8F2" stroke="#2A0F24" style="stroke-width: 2.5px; stroke-linejoin: round"></path>
<circle cx="60" cy="26" r="4" fill="${p.capColor}"></circle>
<circle cx="66" cy="32" r="4" fill="${p.capColor}"></circle>
<circle cx="60" cy="38" r="4" fill="${p.capColor}"></circle>
<circle cx="54" cy="32" r="4" fill="${p.capColor}"></circle>
<circle cx="60" cy="32" r="2.5" fill="#2A0F24"></circle>
<path d="M45 56 C43 50 34 50 34 57 C34 63 41 67 45 71 C49 67 56 63 56 57 C56 50 47 50 45 56 Z" fill="${p.labelColor}" stroke="#2A0F24" style="stroke-width: 2px; stroke-linejoin: round"></path>
<path d="M75 56 C73 50 64 50 64 57 C64 63 71 67 75 71 C79 67 86 63 86 57 C86 50 77 50 75 56 Z" fill="${p.labelColor}" stroke="#2A0F24" style="stroke-width: 2px; stroke-linejoin: round"></path>
<path d="M35 53 L30 48 M39 50 L36 44 M85 53 L90 48 M81 50 L84 44" fill="none" stroke="#2A0F24" style="stroke-width: 2px; stroke-linecap: round"></path>
<path d="M60 75 L56.5 81 L63.5 81 Z" fill="#2A0F24"></path>
<path d="M46 94 L74 94 M50 90 L50 98 M55 90 L55 98 M60 90 L60 98 M65 90 L65 98 M70 90 L70 98" fill="none" stroke="#2A0F24" style="stroke-width: 2px; stroke-linecap: round"></path>
<circle cx="33" cy="76" r="3" fill="${p.capColor}"></circle>
<circle cx="87" cy="76" r="3" fill="${p.capColor}"></circle>
</svg>
<div style="font-family: 'Pacifico', cursive; font-size: 76px; line-height: 1.15">Chula</div>
<div style="font-family: 'Bungee', sans-serif; font-size: 42px; line-height: 1">TEQUILA</div>
<div style="font-family: 'Bungee', sans-serif; font-size: 18px; padding: 4px 16px; border-radius: 999px; background: ${p.accentColor}; color: #1A0A16">BLANCO</div>
<div style="margin-top: auto; font-size: 15px; line-height: 1.5">[容量] ml ・ [度数]% vol<br>NOM-[番号]</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">裏ラベル（日本の必須表示）</h2>
<div style="width: 420px; height: 600px; box-sizing: border-box; padding: 28px; border-radius: 36px; border: 4px solid #2A0F24; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: row; align-items: baseline; gap: 10px">
<span style="font-family: 'Pacifico', cursive; font-size: 28px; line-height: 1.2; color: #C2185B">Chula</span>
<span style="font-family: 'Bungee', sans-serif; font-size: 18px">TEQUILA</span>
</div>
<div style="display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; line-height: 1.5">
<div style="font-weight: 700">品名</div><div>テキーラ</div>
<div style="font-weight: 700">品目</div><div>スピリッツ</div>
<div style="font-weight: 700">原材料名</div><div>[原材料]</div>
<div style="font-weight: 700">アルコール分</div><div>[度数]%</div>
<div style="font-weight: 700">内容量</div><div>[容量]ml</div>
<div style="font-weight: 700">原産国名</div><div>メキシコ</div>
<div style="font-weight: 700">輸入者</div><div>[社名]／[住所]</div>
<div style="font-weight: 700">引取先</div><div>[引取先所在地]</div>
<div style="font-weight: 700">メキシコ表示</div><div>NOM-[番号]・Hecho en México</div>
</div>
<div style="font-size: 12px; line-height: 1.6; display: flex; flex-direction: column; gap: 4px">
<div>20歳未満の者の飲酒は法律で禁止されています。</div>
<div>妊娠中や授乳期の飲酒は、胎児・乳児の発育に悪影響を与えるおそれがあります。</div>
<div>[シーシャ使用時の注意文言：要検討]</div>
</div>
<div style="margin-top: auto; width: 180px; height: 64px; box-sizing: border-box; border: 2px dashed #8A6A7E; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5E4456">[JANコード]</div>
</div>
</div>
</div>`; }

var B = [
  { labelColor: '#FF4FA3', accentColor: '#12B8A6', capColor: '#F2C14E', inkColor: '#2A0F24', variant: 'ROSA' },
  { labelColor: '#3FD9C4', accentColor: '#FF4FA3', capColor: '#FF4FA3', inkColor: '#10302C', variant: 'MENTA' },
  { labelColor: '#1E1420', accentColor: '#FF4FA3', capColor: '#F2C14E', inkColor: '#F7E7F0', variant: 'NOCHE' }
];
document.getElementById('stageMain').innerHTML =
  '<div style="width:1200px;height:880px;box-sizing:border-box;padding:48px;background:#140B14;display:flex;flex-direction:column;gap:32px;font-family:\'Zen Maru Gothic\',sans-serif;color:#F7E7F0">' +
  '<div style="display:flex;flex-direction:row;align-items:baseline;gap:20px;flex-wrap:wrap">' +
  '<span style="font-family:\'Pacifico\',cursive;font-size:48px;line-height:1.2;color:#FF4FA3">Chula</span>' +
  '<span style="font-family:\'Bungee\',sans-serif;font-size:22px">TEQUILA</span>' +
  '<span style="font-size:15px;color:#CDB8C6">暗いシーシャ店の棚でどう見えるか</span></div>' +
  '<div style="display:flex;flex-direction:row;justify-content:space-around;align-items:flex-end">' +
  B.map(bottle).join('') + '</div></div>';
document.getElementById('stageLabel').innerHTML = labels({ labelColor: '#FF4FA3', accentColor: '#12B8A6', capColor: '#F2C14E' });

function fit() {
  [['fitMain', 'stageMain', 880], ['fitLabel', 'stageLabel', 760]].forEach(function (a) {
    var box = document.getElementById(a[0]), st = document.getElementById(a[1]);
    var s = box.clientWidth ? Math.min(1, box.clientWidth / 1200) : 1;
    st.style.transform = 'scale(' + s + ')';
    box.style.height = Math.round(a[2] * s) + 'px';
  });
}
window.addEventListener('resize', fit);
if (window.ResizeObserver) { var ro = new ResizeObserver(fit); ro.observe(document.body); }
fit();
</script>
</body>
</html>
